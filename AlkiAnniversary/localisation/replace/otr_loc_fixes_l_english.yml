l_english:
 CULT_HELP_DESC:2 "New cults can be gained by §Ypromoting§! cultures from groups other than our own and §Yconquering§! land of other religions. To view cults outside of our §Yculture group§!, enact the decision §YPromote Spiritual Diversity§!"
 CURRENT_KARMA:1 "Current Yanantin"
 USES_KARMA:1 "$COUNTRY|Y$ uses Yanantin."
 USES_NOT_KARMA:1 "$COUNTRY|Y$ does NOT use Yanantin."
 KARMA_OFFENSIVE_WAR_EFF:1 "Declaring war is an inherently immoral action, and it will increase our darkness by §Y$VAL$§!. "
 KARMA_INCREASE:1 "This will give us §Y$VAL$§! light."
 KARMA_DECREASE:1 "This will cost us §Y$VAL$§! darkness."
 KARMA_INCREASE_FOR_COUNTRY:1 "This will give $COUNTRY$ §Y$VAL$§! light."
 KARMA_DECREASE_FOR_COUNTRY:1 "This will cost $COUNTRY$ §Y$VAL$§! darkness."
 KARMA_FROM_CONV:2 "This increases our light by §G+$VAL$§!."
 KARMA_FROM_CONV_CONFIRM:1 "Converting this province will increase our light by §G+$VAL$§!."
 MODIFIER_MONTHLY_KARMA:1 "Monthly Light"
 KARMA_LESS_THAN:1 "Yanantin is less than §Y$VAL$§!.\n"
 KARMA_AT_LEAST:1 "Yanantin is at least §Y$VAL$§!.\n"
 KARMA_JUST_RIGHT_DESC:1 "Yanantin between $LOW$ and $HIGH$"
 KARMA_TOO_HIGH_DESC:1 "Yanantin $HIGH$ or higher"
 KARMA_TOO_LOW_DESC:1 "Yanantin $LOW$ or lower"
 karma_just_right:1 "Neutral Yanantin"
 karma_too_high:1 "High Light"
 karma_too_low:1 "High Darkness"
 KARMA_FOR_CTA:1 "We would gain $KARMA$ light, since this is the right thing to do."
 KARMA_DESC2:1 "Yanantin represents the level of balance within our state, shown as a dichotomy between light and dark. Your state’s Yanantin will rise and fall depending on the actions you take. While our nation experiences a light period, it will reject preparations for war and become solely focused on diplomacy. Conversely, while our nation experiences a dark period it will exclusively focus on bloodshed while ignoring the promises of peace. Countries with Yanantin do not pay any diplomatic power cost for returning cores and releasing countries and vassals in peace deals."
 KARMA_DESC:1 "Light increases from:\n- §YHonoring alliances§!\n- §YReleasing vassals§!\n- §YReleasing nations in peace deals§!\n- §YReturning cores§!\n- §YConverting Provinces§!\n\nDarkness increases from:\n- §YStarting wars§!\n- §YTaking provinces in peace deals§!"
 MODIFIER_YEARLY_KARMA_DECAY:1 "Yearly Yanantin"
 ADD_KARMA_EFFECT:1 "$DIRECTION$ $VALUE$ Yanantin.\n"
 SET_KARMA_EFFECT:1 "Yanantin set to $VALUE$.\n"
 SACRIFICE_RULER_DESC:1 "Sacrificing §Y$TITLE$ $RULER$§! of §Y$COUNTRY$§! to the Gods will lower our Røkkr by §G$AMT$§!, reduce relations by §R-100§! and increase the Liberty desire of all our vassals by §R$LD_INC$%§!."
 SACRIFICE_HEIR_DESC:1 "Sacrificing the heir of §Y$COUNTRY$§! to the Gods will lower our Røkkr by §G$AMT$§!, reduce relations by §R-75§! and increase the Liberty desire of all our vassals by §R$LD_INC$%§!."
 DOOMSDAY_TITLE:1 "Ragnarök Arrives"
 DOOMSDAY_SETUP:1 "When our Røkkr reaches 100."
 DOOMSDAY_3:1 "Ragnarök"
 DOOMSDAYOTHER_TITLE:1 "Ragnarök Arrives"
 DOOMSDAYOTHER_SETUP:1 "When another country's Røkkr reaches 100."
 DOOMSDAYOTHER_3:1 "Ragnarök"
 DOOM_LESS_THAN:1 "Røkkr is less than §Y$VAL$§!.\n"
 DOOM_AT_LEAST:1 "Røkkr is at least §Y$VAL$§!.\n"
 DOOMSDAY_CLOCK:1 "Yearly Røkkr Change"
 DOOM_TOOLTIP_MAX:1 "If Røkkr reaches §Y100§!, we will have no choice but to sacrifice our ruling family, casting our nation into chaos."
 DOOM_TOOLTIP_DESC:1 "Our people believe that the world will come to an end unless our gods are strong enough to prevent it. By §Ywinning battles, occupying provinces and sacrificing the rulers and heirs of our subjects§! we can acquire captives to sacrifice, giving strength to the gods and ensuring that Ragnarök never arrives."
 DOOM_TOOLTIP_EFFECTS:1 "§YEffects from our current Røkkr:§!\n"
 doom:1 "Røkkr"
 ADD_DOOM:1 "$DIRECTION$ $VALUE$ Røkkr"
 USES_NOT_DOOM:1 "§Y$COUNTRY$§! does NOT have Røkkr"
 USES_DOOM:1 "§Y$COUNTRY$§! has Røkkr"
 NO_MONSOON:2 "There is no Hurricane season here."
 MONSOONS_WILL_BE:2 "Hurricane seasons here are $SEVERITY|Y$."
 REFORM_DESIRE_TOOLTIP:1 "§YPapal Authority§!\nThis is how much authority the papacy is perceived to have among its followers. Sliding on a scale from 0-200, Papal Authority is universal across our faith and can be impacted by the actions of an individual monarch. Papal Authority determines the rewards of the curia abilities and the appearance of events. If papal authority falls too low, some within the church may look for authority elsewhere or even attempt to found their own heresies."
 PIETY_DESCRIPTION:3 "Liberalism represents the type of constitutional interpretation that your ruler promotes within your nation. It is measured on a scale between -100 (§YPopulism§!) and 100 (§YRegalism§!).\nThe liberalism of your ruler is affected by various actions you can take. Event options will move your position on the scale as will declaring war on heathens and heretics (increase) or brothers in faith (decrease)."
 PIETY_DESCRIPTION_ESTATES:2 "\nThe type of liberalism of your ruler will influence the loyalty of your Estates."
 PATRIARCH_DESCRIPTION:2 "Solidarity represents the level of cohesion between laborers in our nation. In Collectivist provinces, high Solidarity will decrease local unrest and increase the number of recruits joining the army."
 MAPMODE_EMPIRE_DESC:1 "Colors the provinces that are part of the Union of California.\nPurple belongs to the Emperor, brown belongs to an Elector, and blue belongs to a Free City. Green provinces are simply part of the Empire.\nYellow-striped provinces are part of the Empire, but their Owner is not.\nOrange-striped provinces are part of the Empire, but they are subject of a non-Empire overlord.\n"
 MAPMODE_PATRIARCHS_DESC:2 "This displays states with Communes. Yellow states have a Commune, green states can be assigned one, and red states cannot have a Commune."
 CURRENT_PATRIARCH_AUTHORITY:1 "Current Solidarity"
 libertas_ecclesiae_DESC:1 "Libertas ecclesiae is the notion of freedom of ecclesiastical authority from secular or the temporal power, which guided the Reform movement which began in the 11th century.\nBut what if a puppet of the Holy Roman Emperor is sitting on the Throne of Saint Peter?"
 apostolicae_servitutis:1 "Paz Eterna"
 apostolicae_servitutis_DESC:1 "Despite the many bloody wars waged between Catholics and their heathen neighbors, the Tepeyac papacy has routinely denounced war as a means of resolving disputes. The Paz Eterna, or eternal peace, once protected the Catholic world, perhaps it can once again return."
 dei_gratia_rex:1 "La Defensa de la Cristiandad"
 dei_gratia_rex_DESC:3 "The stench of heathen hordes continues to waft over the Middle Seas onto our holy continent. God Wills that something be done to enlighten them."
 illius_qui_se_pro_divini:1 "Erudición Eclesiastica"
 illius_qui_se_pro_divini_DESC:2 "Scholarship brings one closer to the Almighty, we ought to expand places of education so that we may study his word and learn how to lead better lives."
 praeclara_carissimi:2 "Derecho Divino"
 praeclara_carissimi_DESC:2 "The Catholic world was ordered by the hand of God. It is by his hand that rulers are selected and guided."
